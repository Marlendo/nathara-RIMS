# rims-web: static server untuk build produksi FE RIMS (hasil `bun run build`, outDir build/).
# Dijalankan sebagai sidecar user-space (tanpa root):
#   docker run -d --name rims-web --network siakad-network \
#     -v ~/nathara/nathara-RIMS/frontend/build:/usr/share/nginx/html:ro \
#     -v ~/nathara/nathara-RIMS/deploy/rims-web.conf:/etc/nginx/conf.d/default.conf:ro \
#     --restart unless-stopped nginx:alpine
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
