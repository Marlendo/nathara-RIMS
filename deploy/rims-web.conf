# rims-web: static server untuk build produksi FE RIMS (hasil `bun run build`, outDir build/).
# Dijalankan sebagai sidecar user-space (tanpa root):
#   docker run -d --name rims-web --network siakad-network \
#     -v ~/nathara/nathara-RIMS/frontend/build:/usr/share/nginx/html:ro \
#     -v ~/nathara/nathara-RIMS/deploy/rims-web.conf:/etc/nginx/conf.d/default.conf:ro \
#     --restart unless-stopped nginx:alpine
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # L-02 (PM RIMS 0002): security headers dari edge static (tambahan selain
    # header origin Flask after_request + Cloudflare). HSTS diserahkan ke
    # Cloudflare/proxy TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # M-03: rate-limit /auth/* diterapkan di ingress backend (lihat
    # deploy/rims-auth-ratelimit.conf.example) — BUKAN di sidecar statis ini.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
